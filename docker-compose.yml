services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eurorack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD - run ./setup.sh first}
      POSTGRES_DB: eurorack
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurorack -d eurorack"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://eurorack:${POSTGRES_PASSWORD}@db:5432/eurorack
      MANUALS_DIR: /data/manuals
      EXPORTS_DIR: /data/exports
      # Set to 1 by setup.sh when the TLS override is active, so the session
      # cookie gets the Secure attribute only where HTTPS is actually served.
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
    volumes:
      - manuals:/data/manuals
      # Finished rack-export zips; each is deleted after its one download.
      - exports:/data/exports
      # Subscription logins for the LLM provider CLIs, from the host.
      # Log in on the host first: `claude` + /login, and/or `codex login`.
      - ${CLAUDE_CONFIG_DIR:-~/.claude}:/home/node/.claude
      - ${CODEX_CONFIG_DIR:-~/.codex}:/home/node/.codex
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  manuals:
  exports:
