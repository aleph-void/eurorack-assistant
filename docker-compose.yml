services:
  db:
    image: postgres:16-alpine
    # pg_stat_statements has to be loaded at startup (it takes shared memory),
    # so it is a server argument rather than a setting the extension turns on
    # for itself. It is what tells a performance audit which statements the
    # app really spends its time in, instead of inferring it from the schema
    # and the table-level scan counters. The extension itself is created by
    # deploy/db-init, which runs when the data volume is first made; an
    # existing database needs one CREATE EXTENSION by hand after the restart
    # that puts this argument in place (the file says how).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      # The image's defaults are sized for a machine from twenty years ago
      # (128 MB of shared buffers, 4 MB per sort) and tell the planner that
      # a random read costs four sequential ones, which is true of a
      # spinning disk and not of anything this runs on. These are modest
      # for a host with a few gigabytes; raise them with the host.
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
    # Docker's default /dev/shm is 64 MB, which Postgres's parallel workers
    # share; sized with the buffers above.
    shm_size: 256m
    environment:
      POSTGRES_USER: eurorack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD - run ./setup.sh first}
      POSTGRES_DB: eurorack
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume above is created.
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurorack -d eurorack"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    # node is PID 1 in this container and spawns chromium, ffmpeg, yt-dlp
    # and the LLM CLIs; a grandchild orphaned by a killed chromium reparents
    # to it, and node does not reap, so without an init the zombies pile up
    # over weeks of uptime.
    init: true
    environment:
      DATABASE_URL: postgres://eurorack:${POSTGRES_PASSWORD}@db:5432/eurorack
      MANUALS_DIR: /data/manuals
      EXPORTS_DIR: /data/exports
      CAPTURES_DIR: /data/captures
      PANELS_DIR: /data/panels
      VIDEOS_DIR: /data/videos
      # Set to 1 by setup.sh when the TLS override is active, so the session
      # cookie gets the Secure attribute only where HTTPS is actually served.
      SECURE_COOKIES: ${SECURE_COOKIES:-0}
      # nginx has the panels volume mounted (below) and sends panel pictures
      # itself once the API has said yes to one (routes/panels.js).
      PANELS_ACCEL_PREFIX: /_panels
      # Where yt-dlp's bgutil plugin fetches YouTube "proof of origin"
      # tokens (services/videos.js). The tv_simply client works without one,
      # so a dead sidecar degrades to a warning, not a failure.
      POT_PROVIDER_URL: http://potprovider:4416
    volumes:
      - manuals:/data/manuals
      # Finished rack-export zips; each is deleted after its one download.
      - exports:/data/exports
      # Waveform images captured from a connected oscilloscope.
      - captures:/data/captures
      # Module front-panel images: the ones found on the web, and the logical
      # panels the server draws when no usable picture exists.
      - panels:/data/panels
      # Work files of attached YouTube videos (frames + transcript), deleted
      # once their analysis lands; a volume so a redeploy mid-job keeps them.
      - videos:/data/videos
      # Per-user LLM provider credentials: a CLI home directory per user
      # (claude config dirs, codex auth.json files) …
      - llm:/data/llm
      # … and the key that encrypts the tokens stored in the database, kept
      # outside the database on purpose (a dump alone can't use the tokens).
      - llmkeys:/data/keys
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Generates the "proof of origin" tokens YouTube demands before it will
  # serve video data to a datacenter IP; the bgutil yt-dlp plugin in the
  # server image calls it over HTTP. The tag is pinned to the plugin zip
  # version in server/Dockerfile — bump the two together.
  potprovider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    init: true
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      # Read-only: nginx sends panel pictures from here on the API's
      # X-Accel-Redirect (nginx.conf, location /_panels/); the API is what
      # writes them.
      - panels:/data/panels:ro
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  manuals:
  exports:
  captures:
  panels:
  videos:
  llm:
  llmkeys:
