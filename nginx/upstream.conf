# The Express server, as an upstream rather than a bare proxy_pass address so
# nginx keeps connections to it open: without a keepalive pool every proxied
# request opens a new TCP connection to the server, and a studio page is a
# few hundred of them. Included at the http level (conf.d), so it survives
# the TLS override, which replaces default.conf alone. The /api/ location in
# each vhost names it and clears the Connection header, which is what lets a
# connection be reused; the two WebSocket locations keep "upgrade" and still
# point here, since an upgraded connection is never returned to the pool.
upstream api {
    server server:3000;
    keepalive 32;
}
