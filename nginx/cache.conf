# Compression and browser-cache policy for the built client. Included by both
# vhosts — the plain-HTTP one baked into the image (nginx.conf) and the TLS
# one setup.sh mounts over it (tls.conf.template) — so a change here reaches
# whichever of the two a deployment actually runs.
#
# Nothing here decides anything about /api/: the server sets Cache-Control on
# every API response itself (server/src/app.js), and the routes that stream
# content-addressed bytes set their own immutable policy.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
# Compress for clients sitting behind a proxy of their own, too.
gzip_proxied any;
gzip_vary on;
# text/html is always compressed and cannot be listed here. .js is served as
# application/javascript by this nginx and as text/javascript by newer
# mime.types, so both are named.
gzip_types
    application/javascript
    text/javascript
    application/json
    application/pdf
    application/wasm
    image/svg+xml
    text/css
    text/plain;

# Vite writes the content hash into every file name under assets/, so changed
# content is a different URL and these bytes are good forever. Said out loud
# rather than left to nginx's ETag, which is built from the file's mtime: a
# rebuild changes that even when the bytes are identical, so without this
# header every deploy re-downloads the 21 MB onnxruntime wasm that voice
# input pulls in. No SPA fallback in here on purpose — a hashed file that is
# missing should be a 404, not index.html served as JavaScript.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# The shell naming those hashed files must never outlive a deploy. A stale
# index.html asks for assets the new build deleted, and the fallback below
# answers those .js requests with HTML — a blank page until a hard reload.
location = /index.html {
    add_header Cache-Control "no-cache";
}
