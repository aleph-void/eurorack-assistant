# Compression and browser-cache policy for the built client. Included by both
# vhosts — the plain-HTTP one baked into the image (nginx.conf) and the TLS
# one setup.sh mounts over it (tls.conf.template) — so a change here reaches
# whichever of the two a deployment actually runs.
#
# Nothing here decides anything about /api/: the server sets Cache-Control on
# every API response itself (server/src/app.js), and the routes that stream
# content-addressed bytes set their own immutable policy. The content security
# policy is split the same way, and rides along in the locations below —
# csp-headers.conf says why it has to be repeated rather than set once.

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
# Compress for clients sitting behind a proxy of their own, too.
gzip_proxied any;
gzip_vary on;
# The built client is compressed ONCE, in the image (nginx/Dockerfile writes
# a .gz beside every script, stylesheet and wasm file under assets/), and
# served from that: nginx otherwise squeezed the 23 MB onnxruntime wasm at
# level 5 for every browser that switched voice input on, and every page's
# scripts for every page load. A file with no .gz beside it is still
# compressed on the fly below.
gzip_static on;
# text/html is always compressed and cannot be listed here. .js is served as
# application/javascript by this nginx and as text/javascript by newer
# mime.types, so both are named. A PDF is not listed: its streams are
# already deflated, and a manual is twenty megabytes squeezed for a few
# percent on every download.
gzip_types
    application/javascript
    text/javascript
    application/json
    application/wasm
    image/svg+xml
    text/css
    text/plain;

# Fill each packet before it goes (sendfile is on in the stock config, and
# this is the pairing it is documented with).
tcp_nopush on;

# Vite writes the content hash into every file name under assets/, so changed
# content is a different URL and these bytes are good forever. Said out loud
# rather than left to nginx's ETag, which is built from the file's mtime: a
# rebuild changes that even when the bytes are identical, so without this
# header every deploy re-downloads the 21 MB onnxruntime wasm that voice
# input pulls in. No SPA fallback in here on purpose — a hashed file that is
# missing should be a 404, not index.html served as JavaScript.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    # add_header does not inherit into a location that sets one of its own,
    # so the policy has to be repeated wherever it is: see csp-headers.conf.
    include /etc/nginx/snippets/csp-headers.conf;
}

# The shell naming those hashed files must never outlive a deploy. A stale
# index.html asks for assets the new build deleted, and the fallback below
# answers those .js requests with HTML — a blank page until a hard reload.
location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/csp-headers.conf;
}
