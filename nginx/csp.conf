# Content-Security-Policy for the CLIENT SHELL: index.html, the built assets,
# and the pages a person actually looks at. Included at the http level (this
# file is copied into conf.d/, which nginx includes inside http{}), because a
# `map` may only be written there — the header itself is added per location by
# snippets/csp-headers.conf.
#
# WHY IT IS HERE AND NOT IN THE SERVER. nginx serves the client; Express never
# sees a request for index.html. So the policy is set one place per layer, the
# same division as the cache policy in cache.conf: this file governs the shell,
# server/src/csp.js governs /api. That file is also where the reasoning lives,
# and server/tests/csp.test.js reads THIS file and holds it to the invariants
# below, so the two halves cannot drift apart unnoticed.
#
# THE POLICY, DIRECTIVE BY DIRECTIVE. Everything comes from this origin unless
# a line below says otherwise:
#
#   script-src  'self' and WebAssembly. The build emits no inline script (see
#     client/index.html — one <script src>, nothing else), so no nonce, no
#     hash, and above all no 'unsafe-inline': an injected <script> has nothing
#     to fetch and never runs. 'wasm-unsafe-eval' is for the local Whisper
#     recogniser, whose onnxruntime compiles a 23 MB WebAssembly module served
#     out of /assets/ — it permits WebAssembly compilation and nothing else,
#     which is why it exists as a keyword separate from 'unsafe-eval'.
#
#   style-src   'self'. Vite extracts every SFC's <style> block into a real
#     stylesheet, and Vue applies :style bindings through the CSSOM, which CSP
#     does not govern. What this DOES refuse is a style="" attribute arriving
#     inside sanitized markdown — an answer, a note, a manual's extracted
#     text. That is a refusal worth having.
#
#   worker-src  'self' blob:. onnxruntime starts its runtime from a blob URL;
#     a blob: worker inherits this policy and the origin that made it.
#
#   connect-src 'self', the WebSocket, and huggingface.co. The socket is
#     named outright rather than left to 'self': the spec writes that keyword
#     around https/wss, browsers have disagreed for years about whether ws://
#     on a plain-http page falls under it (Chromium allows it today), and the
#     job progress feed at /api/ws is the app's whole live half. Naming it
#     costs one host — the one this request arrived at — and removes the
#     question. huggingface.co is where the Whisper model weights come from the
#     first time someone turns that recogniser on (docs/voice-patching.md) —
#     the download redirects onto the hf.co CDN, and CSP checks every hop of a
#     redirect, so both are named. A deployment that self-hosts the weights
#     (VITE_WHISPER_MODEL_PATH) can drop all three and be the better for it.
#
#   frame-ancestors 'none'  — nobody frames this app, so a transparent overlay
#     over a real page can never be a click on this one. This is the modern
#     X-Frame-Options and outranks it.
#   base-uri 'self'         — an injected <base> cannot re-point every
#     relative URL on the page at somewhere else.
#   object-src 'none'       — no plugins, ever.
#   form-action 'self'      — a form on this page posts to this app or
#     nowhere. The app submits over fetch, so nothing legitimate is affected.
#
#   report-uri / report-to  — where the browser says what it refused. The
#     route is /api/csp-reports and the reports are read by an admin at
#     /admin/csp-reports; see server/src/routes/cspReports.js.

# The WebSocket source, written out because 'self' does not cover it. $host
# would drop the port a dev or non-standard deployment is reached on, so the
# Host header is used as it arrived — nginx has already refused anything that
# is not a valid host by the time this is read. With no Host at all (HTTP/1.0)
# this is EMPTY rather than a bare "ws:", which would allow a socket to
# anywhere.
map $http_host $csp_websocket {
    ""      "";
    default "ws://$http_host wss://$http_host";
}

# The Reporting API only delivers from a secure context, and a browser that
# sees report-to ignores report-uri altogether — so on a plain-HTTP
# deployment, naming it would mean no reports at all. It is therefore added
# only where it can work, and report-uri (deprecated, universally supported,
# and the only one Firefox and Safari send) is always there underneath.
map $scheme $csp_report_to {
    https   " report-to csp;";
    default "";
}

map $scheme $csp_reporting_endpoints {
    https   "csp=\"/api/csp-reports\"";
    default "";
}

# The policy itself. One line, because a directive list is one value.
map $host $csp_policy {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self' blob:; connect-src 'self' $csp_websocket https://huggingface.co https://*.hf.co https://*.huggingface.co; report-uri /api/csp-reports;$csp_report_to";
}

# Tightening a live policy is done by watching, not by guessing: put the
# policy in $csp_report_only instead of $csp_enforced and every browser goes
# on loading what it always did while telling /api/csp-reports what it WOULD
# have refused. An add_header whose value is empty is not sent at all, which
# is what makes this a switch rather than a pair of edits.
map $host $csp_enforced {
    default $csp_policy;
}

map $host $csp_report_only {
    default "";
}
