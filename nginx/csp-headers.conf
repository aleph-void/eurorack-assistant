# The three headers that carry the policy defined in conf.d/00-csp.conf.
#
# Included INSIDE each location that serves the client's own bytes rather than
# once at the server level, for two reasons. add_header does not inherit into a
# location that has add_header directives of its own, and cache.conf gives both
# /assets/ and index.html theirs — a policy set at the server level would be
# silently missing from the one response that matters most. And /api/ must NOT
# have it: those responses carry their own, far stricter policy from
# server/src/csp.js, and two Content-Security-Policy headers on one response
# are enforced as the intersection of both, which is a thing nobody writing
# either one of them is thinking about.
#
# Only one of the first two is ever sent: see the $csp_enforced /
# $csp_report_only switch in conf.d/00-csp.conf.
add_header Content-Security-Policy $csp_enforced always;
add_header Content-Security-Policy-Report-Only $csp_report_only always;
# Names the report-to group the policy points at. Empty (and so not sent at
# all) on a plain-HTTP deployment, where the Reporting API cannot deliver.
add_header Reporting-Endpoints $csp_reporting_endpoints always;
